name: Flatpak

on:
  push:
    branches: [prod, dev]
    tags: ["v*"]
  pull_request:
    branches: [prod, dev]
  merge_group:

jobs:
  production:
    name: Build (production)
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.bootcinstaller.Installer.flatpak
          manifest-path: flatpak/org.bootcinstaller.Installer.json
          cache-key: flatpak-builder-production-${{ github.sha }}

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: org.bootcinstaller.Installer.flatpak
          path: org.bootcinstaller.Installer.flatpak
          retention-days: 30

      - name: Attach stable asset to latest versioned release (prod branch)
        if: github.ref == 'refs/heads/prod'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The stable channel uses GitHub's /releases/latest/download/ redirect,
          # which auto-resolves to the newest non-prerelease versioned tag.
          # We no longer maintain a rolling 'latest-stable' tag — its name is
          # permanently banned by a GitHub ruleset after an immutable release.
          # The versioned tag release already has the asset attached by the
          # 'Attach bundle to tagged release' step below; nothing to do here.
          echo "Stable channel served via releases/latest/download/ → $(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach bundle to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: tagged-org.bootcinstaller.Installer.flatpak
          path: org.bootcinstaller.Installer.flatpak
          retention-days: 1

  devel:
    name: Build (devel)
    if: >-
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.bootcinstaller.Installer.Devel.flatpak
          manifest-path: flatpak/org.bootcinstaller.Installer.Devel.json
          cache-key: flatpak-builder-devel-${{ github.sha }}

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: org.bootcinstaller.Installer.Devel.flatpak
          path: org.bootcinstaller.Installer.Devel.flatpak
          retention-days: 30

      # NEVER delete this release or its tag.
      #
      # Once a release has existed on a tag, that tag name is permanently
      # banned from re-creation by the immutable-release ruleset. The previous
      # version of this step deleted `latest-dev` and then re-created it on
      # every dev push; the first push after the ruleset took effect destroyed
      # the release and could not put it back, taking the whole dev flatpak
      # channel down (dakota-iso then 404s and silently falls back to the
      # upstream tuna-os bundle). `latest-dev` is burned for good — hence the
      # new tag name below.
      #
      # Create-if-missing, then clobber the asset. No deletes, ever.
      - name: Publish dev pre-release (dev branch)
        if: github.ref == 'refs/heads/dev'
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! gh release view "$DEV_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$DEV_RELEASE_TAG" \
              --title "Dev Build" \
              --prerelease \
              --notes "Rolling build from the \`dev\` branch. May be unstable."
          fi
          gh release upload "$DEV_RELEASE_TAG" \
            org.bootcinstaller.Installer.Devel.flatpak --clobber
          gh release edit "$DEV_RELEASE_TAG" \
            --notes "Rolling build from the \`dev\` branch. May be unstable.
          Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RELEASE_TAG: dev-rolling

      - name: Upload devel bundle for tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: tagged-org.bootcinstaller.Installer.Devel.flatpak
          path: org.bootcinstaller.Installer.Devel.flatpak
          retention-days: 1

  publish-tagged-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [production, devel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download production bundle
        uses: actions/download-artifact@v4
        with:
          name: tagged-org.bootcinstaller.Installer.flatpak

      - name: Download devel bundle
        uses: actions/download-artifact@v4
        with:
          name: tagged-org.bootcinstaller.Installer.Devel.flatpak

      - name: Create and publish release
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Upload assets to the release, creating it if needed.
          # The release may already exist if the tag was pushed manually
          # before CI ran (common during hotfix cycles).
          if ! gh release create ${{ github.ref_name }} \
              --repo ${{ github.repository }} \
              --title "bootc-installer ${{ github.ref_name }}" \
              --notes "Release ${{ github.ref_name }}" \
              org.bootcinstaller.Installer.flatpak \
              org.bootcinstaller.Installer.Devel.flatpak; then
            echo "Release already exists — uploading assets to existing release"
            gh release upload ${{ github.ref_name }} \
              --repo ${{ github.repository }} \
              --clobber \
              org.bootcinstaller.Installer.flatpak \
              org.bootcinstaller.Installer.Devel.flatpak
          fi
        env:
          GH_TOKEN: ${{ github.token }}
